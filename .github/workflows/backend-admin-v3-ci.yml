name: backend-admin-v3 CI (Merge, Lint and Build)

on:
  pull_request:
    branches: [dev, production]
    paths:
      - "apps/backend-admin-v3/**"

concurrency:
  group: backend-admin-v3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend-admin-v3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backend_admin_v3_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/backend_admin_v3_ci
      PAYLOAD_SECRET: ci-dummy-secret
      TOKEN_SECRET: ci-dummy-token-secret
      # placeholders only — dummy values so config import doesn't throw;
      # confirm during first real run whether more are required
      MICROSOFT_CLIENT_ID: ci-dummy
      MICROSOFT_CLIENT_SECRET_VALUE: ci-dummy
      MICROSOFT_CLIENT_SECRET_KEY: ci-dummy
      MICROSOFT_TENANT_ID: ci-dummy
      OASYS_H2A_CLIENT_ID: ci-dummy
      OASYS_H2A_CLIENT_SECRET: ci-dummy
      OASYS_H2A_CLIENT_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/backend-admin-v3/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run migration
        run: yarn migrate:latest

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

  # Runs after `ci` succeeds, only for same-repo PRs targeting `production`, and only when
  # apps/backend-admin-v3/src/migrations/** changed in the PR. Restores a real production
  # dump (GET /backup?dbOnly=true) into a throwaway Postgres and applies this PR's pending
  # migrations against it, catching failures against real prod data before merge.
  migration-prerun:
    needs: ci
    if: >-
      success() &&
      github.event.pull_request.base.ref == 'production' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/backend-admin-v3
    env:
      DATABASE_URI: postgres://postgres:postgres@localhost:5432/backend_admin_v3_migration_prerun
      PAYLOAD_SECRET: migration-prerun-dummy-secret
      TOKEN_SECRET: migration-prerun-dummy-token-secret
      MICROSOFT_CLIENT_ID: ci-dummy
      MICROSOFT_CLIENT_SECRET_VALUE: ci-dummy
      MICROSOFT_CLIENT_SECRET_KEY: ci-dummy
      MICROSOFT_TENANT_ID: ci-dummy
      OASYS_H2A_CLIENT_ID: ci-dummy
      OASYS_H2A_CLIENT_SECRET: ci-dummy
      OASYS_H2A_CLIENT_BASE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether backend-admin-v3 migrations changed in this PR
        id: changes
        working-directory: .
        run: |
          # Three-dot diff: only what this PR introduces, not commits production has that the head lacks.
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- apps/backend-admin-v3/src/migrations/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes under apps/backend-admin-v3/src/migrations/ in this PR — skipping production migration pre-run."
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/backend-admin-v3/yarn.lock

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: yarn install --frozen-lockfile

      - name: Download production database dump (dbOnly)
        if: steps.changes.outputs.changed == 'true'
        env:
          BACKUP_API_URL: ${{ secrets.BACKUP_API_URL }}
          BACKUP_API_KEY: ${{ secrets.BACKUP_API_KEY }}
        run: |
          if [ -z "$BACKUP_API_URL" ] || [ -z "$BACKUP_API_KEY" ]; then
            echo "::error::BACKUP_API_URL and/or BACKUP_API_KEY repo secrets are not configured (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          curl -sS --fail-with-body --max-time 600 -o /tmp/prod-db.sql \
            -H "Authorization: users API-Key ${BACKUP_API_KEY}" \
            "${BACKUP_API_URL}?dbOnly=true" || { cat /tmp/prod-db.sql 2>/dev/null; exit 1; }
          test -s /tmp/prod-db.sql
          grep -m2 '^-- Dumped' /tmp/prod-db.sql

      - name: Start Postgres matching the dump's pg_dump version
        if: steps.changes.outputs.changed == 'true'
        run: |
          # A newer pg_dump emits syntax an older server/psql rejects (e.g. PG17's
          # `SET transaction_timeout`, `\restrict`), so match the dump's major version.
          PG_MAJOR=$(grep -m1 -oE '^-- Dumped by pg_dump version [0-9]+' /tmp/prod-db.sql | grep -oE '[0-9]+$' || true)
          if [ -z "$PG_MAJOR" ]; then
            echo "::error::Could not read the pg_dump version from the dump header"
            exit 1
          fi
          echo "Starting postgres:$PG_MAJOR"
          docker run -d --name prerun-pg \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=backend_admin_v3_migration_prerun \
            -p 5432:5432 "postgres:$PG_MAJOR"
          # -h 127.0.0.1: the image's init phase is socket-only, so this waits for the real server.
          for _ in $(seq 1 30); do
            docker exec prerun-pg pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs prerun-pg
          echo "::error::Postgres did not become ready"
          exit 1

      - name: Restore production dump into throwaway database
        if: steps.changes.outputs.changed == 'true'
        run: |
          # performBackup runs pg_dump with default flags, so the dump carries OWNER TO / GRANT /
          # REVOKE / ALTER DEFAULT PRIVILEGES statements naming production roles that don't exist
          # here. Drop those statements, but never touch COPY data blocks (row text can start
          # with "GRANT " too).
          awk '
            in_copy { print; if ($0 == "\\.") in_copy = 0; next }
            /^COPY .* FROM stdin;$/ { in_copy = 1; print; next }
            /^(GRANT|REVOKE) / { next }
            /^ALTER DEFAULT PRIVILEGES / { next }
            /^ALTER .* OWNER TO / { next }
            { print }
          ' /tmp/prod-db.sql > /tmp/prod-db.sanitized.sql
          docker exec -i prerun-pg psql -U postgres -q -v ON_ERROR_STOP=1 \
            -d backend_admin_v3_migration_prerun < /tmp/prod-db.sanitized.sql > /dev/null

      # `yarn ci` is what the production deploy runs; its `yes |` answers Payload's dev-mode
      # prompt (prod has a batch = -1 row), which otherwise hangs forever on a closed stdin.
      - name: Run pending migrations and build against restored production data
        if: steps.changes.outputs.changed == 'true'
        run: yarn ci
